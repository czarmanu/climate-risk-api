---
# *****************************************************************************
# github_actions_CI.yml
# *****************************************************************************

# Purpose:
# GitHub Actions is a continuous integration and continuous delivery (CI/CD)
# platform that automates build, test, and deployment steps.

# Author:
# Manu Tom, 2025-

name: CI - Climate Risk API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest netCDF4

      - name: Run script
        run: |
          python src/pipeline.py || true

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Run unit tests with pytest
        run: |
          PYTHONPATH=src pytest tests/ --maxfail=1 --disable-warnings
